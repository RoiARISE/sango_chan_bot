name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 は devcontainer と同じ、3.14 は現行、3.15 は最新。
        # devcontainer のイメージは 3.13 までしか無いので 3.14 には上げられない。
        python-version: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: cp env_example.env .env
      - name: Validate compose config
        run: docker compose config -q
      - name: Build image
        run: docker compose build
      - name: Smoke test container
        run: docker compose run --rm --no-deps bot python -c "import src.bot; from src import config; assert config.INSTANCE_URL; print('smoke ok')"
